<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Nyamuk Terbang — Kamera Langsung 📸🦟</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { 
            background: linear-gradient(to bottom, #87CEEB, #90EE90); 
            min-height: 100vh; 
            overflow-x: hidden;
            padding: 20px;
        }

        /* Kamera kecil di pojok */
        .wadah-kamera {
            position: fixed;
            top: 15px;
            right: 15px;
            width: 160px;
            height: 120px;
            border-radius: 12px;
            border: 3px solid white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
            overflow: hidden;
            z-index: 60;
            background: #000;
        }
        .wadah-kamera video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        .kamera-mati {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: white;
            font-size: 12px;
            text-align: center;
            padding: 5px;
        }

        /* Efek kilatan foto */
        .efek-foto {
            position: fixed;
            top: 0; left: 0;
            width: 200%; height: 200%;
            background: rgba(255,255,255,0);
            pointer-events: none;
            z-index: 99;
        }
        .efek-foto.nyala {
            animation: kilatan 0.5s ease-out;
        }
        @keyframes kilatan {
            0% { background: rgba(255,255,255,0.8); }
            100% { background: rgba(255,255,255,0); }
        }

        /* Galeri foto */
        .galeri-foto {
            position: fixed;
            bottom: 15px;
            right: 15px;
            max-width: 200px;
            z-index: 60;
        }
        .galeri-foto h4 {
            font-size: 12px;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            margin-bottom: 5px;
        }
        .foto-diambil {
            width: 60px;
            height: 45px;
            object-fit: cover;
            border-radius: 6px;
            border: 2px solid gold;
            margin: 2px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .foto-diambil:hover { transform: scale(1.5); }

        /* Soal */
        .soal-container {
            background: white;
            max-width: 700px;
            margin: 0 auto 30px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            position: relative;
            z-index: 50;
        }
        .loading {
            font-size: 20px;
            color: #333;
            padding: 20px;
        }

        /* Area terbang — background kamera */
        .area-terbang {
            position: relative;
            width: 100%;
            height: 420px;
            border: 2px dashed #333;
            border-radius: 15px;
            overflow: hidden;
            background: rgba(255,255,255,0.1);
        }
        .video-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            transform: scaleX(-1);
            opacity: 0.85;
        }

        /* Nyamuk & jawaban */
        .nyamuk {
            position: absolute;
            width: 120px;
            height: 100px;
            cursor: pointer;
            transition: transform 0.2s;
            animation: terbang 4s infinite ease-in-out alternate;
            z-index: 10;
        }
        .nyamuk:hover { transform: scale(1.3); }
        .badan-nyamuk {
            position: relative;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .gambar-nyamuk {
            width: 100%; height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            animation: kepakSayap 0.3s infinite alternate;
        }
        @keyframes kepakSayap {
            0% { transform: scaleX(1) rotate(-3deg); }
            100% { transform: scaleX(1.15) rotate(3deg); }
        }
        .teks-jawaban {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: bold;
            border: 2px solid #333;
            white-space: nowrap;
            font-size: 16px;
            z-index: 20;
        }
        @keyframes terbang {
            0% { transform: translate(0, 0) rotate(-5deg); }
            25% { transform: translate(40px, -25px) rotate(6deg); }
            50% { transform: translate(-25px, 15px) rotate(-4deg); }
            75% { transform: translate(25px, 30px) rotate(5deg); }
            100% { transform: translate(-15px, -20px) rotate(-6deg); }
        }

        /* Pesan benar/salah */
        .benar, .salah {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 30px 50px;
            border-radius: 15px;
            font-size: 30px;
            font-weight: bold;
            z-index: 100;
            display: none;
            text-align: center;
        }
        .benar { background: #90EE90; box-shadow: 0 0 20px green; }
        .salah { background: #FFB6C1; box-shadow: 0 0 20px red; }

        .skor {
            text-align: center;
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            position: relative;
            z-index: 50;
        }

        /* Kanvas tersembunyi */
        #kanvasFoto { display: none; }

        /* Responsif HP */
        @media (max-width: 600px) {
            .wadah-kamera { width: 120px; height: 90px; }
            .soal-container { margin-top: 110px; font-size: 18px; padding: 15px; }
            .galeri-foto { bottom: 10px; right: 10px; }
            .foto-diambil { width: 50px; height: 38px; }
            .area-terbang { height: 350px; }
        }
    </style>
</head>
<body>

<div class="efek-foto" id="efekFoto"></div>

<div class="wadah-kamera" id="wadahKamera">
    <div class="kamera-mati" id="pesanKamera">📷 Meminta akses kamera...</div>
</div>

<div class="soal-container" id="soal">
    <div class="loading">🔄 Sedang memuat soal...</div>
</div>

<div class="area-terbang" id="areaTerbang">
    <!-- Video background dimuat otomatis -->
</div>

<div class="skor">Skor: <span id="nilai">0</span></div>

<div class="galeri-foto">
    <h4>📸 Foto Benar:</h4>
    <div id="daftarFoto"></div>
</div>

<canvas id="kanvasFoto"></canvas>

<div class="benar" id="pesanBenar">✅ BENAR! 🎉<br>📸 Foto Tersimpan!</div>
<div class="salah" id="pesanSalah">❌ Coba Lagi ya 😊</div>

<script>
// === KONFIGURASI ===
const URL_CSV = "soal.csv";
const URL_GAMBAR_NYAMUK = "https://raw.githubusercontent.com/hidayatrasyidsyafira/fotosiswaSMAN9/main/nyamuk.png";
// ===================

let daftarSoal = [];
let nomorSoal = 0;
let skor = 0;
let videoKamera = null;
let hitungFoto = 0;

// 1. AKTIFKAN KAMERA — 2 tampilan: kecil pojok + background area terbang
async function mulaiKamera() {
    const wadah = document.getElementById("wadahKamera");
    const pesan = document.getElementById("pesanKamera");
    const area = document.getElementById("areaTerbang");
    
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "user", width: 640, height: 480 } 
        });

        // Kamera kecil di pojok kanan atas
        wadah.innerHTML = `<video autoplay playsinline id="videoKamera"></video>`;
        videoKamera = document.getElementById("videoKamera");
        videoKamera.srcObject = stream;

        // Kamera sebagai background di area terbang
        area.innerHTML = `<video autoplay playsinline id="videoBg" class="video-bg"></video>`;
        const videoBg = document.getElementById("videoBg");
        videoBg.srcObject = stream;

    } catch (err) {
        pesan.innerHTML = "❌ Kamera tidak bisa dibuka<br>(Izinkan akses kamera)";
        console.error("Kamera error:", err);
    }
}

// 2. AMBIL FOTO OTOMATIS
function ambilFoto() {
    if (!videoKamera) return;
    
    const kanvas = document.getElementById("kanvasFoto");
    const ctx = kanvas.getContext("2d");
    kanvas.width = 320;
    kanvas.height = 240;
    
    // Balik gambar biar seperti cermin
    ctx.translate(kanvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(videoKamera, 0, 0, kanvas.width, kanvas.height);
    
    // Efek kilatan
    const efek = document.getElementById("efekFoto");
    efek.classList.remove("nyala");
    void efek.offsetWidth;
    efek.classList.add("nyala");
    
    // Simpan ke galeri
    const dataFoto = kanvas.toDataURL("image/png");
    hitungFoto++;
    
    const daftar = document.getElementById("daftarFoto");
    const img = document.createElement("img");
    img.src = dataFoto;
    img.className = "foto-diambil";
    img.title = `Foto ${hitungFoto} — Klik untuk simpan`;
    img.onclick = () => {
        const link = document.createElement("a");
        link.href = dataFoto;
        link.download = `foto_benar_${hitungFoto}.png`;
        link.click();
    };
    daftar.appendChild(img);
}

// 3. BACA SOAL DARI CSV
async function ambilSoalCSV() {
    try {
        const res = await fetch(URL_CSV);
        if (!res.ok) throw new Error("File soal.csv tidak ketemu");
        const teks = await res.text();
        
        const baris = teks.trim().split("\n");
        daftarSoal = [];
        
        for (let i = 1; i < baris.length; i++) {
            const bagian = baris[i].split(",");
            if (bagian.length < 3) continue;
            
            const teksSoal = bagian[0].trim();
            const jawabanBenar = bagian[1].trim();
            const pilihan = bagian.slice(2).map(p => p.trim().replace(/"/g, ""));
            
            daftarSoal.push({ teks: teksSoal, jawabanBenar, pilihan });
        }
        
        tampilkanSoal();
    } catch (err) {
        document.getElementById("soal").innerHTML = 
            `<div style="color:red">❌ Gagal muat soal!<br>Pastikan file soal.csv sudah ada di repositori.</div>`;
        console.error(err);
    }
}

// 4. TAMPILKAN SOAL & NYAMUK
function tampilkanSoal() {
    if (!daftarSoal.length) return;
    
    const soalSekarang = daftarSoal[nomorSoal];
    document.getElementById("soal").textContent = `${nomorSoal+1}. ${soalSekarang.teks}`;
    
    const area = document.getElementById("areaTerbang");
    // Simpan video background, hapus hanya nyamuk
    const videoBg = area.querySelector(".video-bg");
    area.innerHTML = "";
    if (videoBg) area.appendChild(videoBg);

    // Acak urutan jawaban
    const pilihanAcak = [...soalSekarang.pilihan].sort(() => Math.random() - 0.5);

    pilihanAcak.forEach((jawab) => {
        const nyamuk = document.createElement("div");
        nyamuk.className = "nyamuk";
        nyamuk.style.left = `${Math.random() * 70 + 10}%`;
        nyamuk.style.top = `${Math.random() * 70 + 10}%`;
        nyamuk.style.animationDuration = `${3 + Math.random() * 2}s`;

        nyamuk.innerHTML = `
            <div class="badan-nyamuk">
                <div class="teks-jawaban">${jawab}</div>
                <div class="gambar-nyamuk" style="background-image: url('${URL_GAMBAR_NYAMUK}')"></div>
            </div>
        `;

        nyamuk.onclick = () => {
            if (jawab === soalSekarang.jawabanBenar) {
                skor++;
                document.getElementById("nilai").textContent = skor;
                ambilFoto(); // Foto otomatis saat benar
                document.getElementById("pesanBenar").style.display = "block";
                setTimeout(() => {
                    document.getElementById("pesanBenar").style.display = "none";
                    nomorSoal++;
                    if (nomorSoal < daftarSoal.length) tampilkanSoal();
                    else alert(`🎉 Selesai! Skor: ${skor}/${daftarSoal.length}\n📸 Foto tersimpan: ${hitungFoto} lembar\nKlik foto di pojok untuk unduh!`);
                }, 1500);
            } else {
                document.getElementById("pesanSalah").style.display = "block";
                setTimeout(() => document.getElementById("pesanSalah").style.display = "none", 1200);
            }
        };

        area.appendChild(nyamuk);
    });
}

// MULAI SEMUA
mulaiKamera();
ambilSoalCSV();
</script>

</body>
</html>
