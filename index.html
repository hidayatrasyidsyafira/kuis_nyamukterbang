<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Nyamuk Terbang 🦟</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { 
            background: linear-gradient(to bottom, #87CEEB, #90EE90); 
            min-height: 100vh; 
            overflow: hidden;
            padding: 20px;
        }
        .soal-container {
            background: white;
            max-width: 700px;
            margin: 0 auto 30px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }        .area-terbang {
            position: relative;
            width: 100%;
            height: 420px;
            border: 2px dashed #333;
            border-radius: 15px;
            background: rgba(255,255,255,0.3);
        }
        .nyamuk {
            position: absolute;
            width: 120px;
            height: 100px;
            cursor: pointer;
            transition: transform 0.2s;
            animation: terbang 4s infinite ease-in-out alternate;
        }
        .nyamuk:hover {
            transform: scale(1.3);
        }
        .badan-nyamuk {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .gambar-nyamuk {
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            animation: kepakSayap 0.3s infinite alternate;
        }
        @keyframes kepakSayap {
            0% { transform: scaleX(1) rotate(-3deg); }
            100% { transform: scaleX(1.15) rotate(3deg); }
        }
        .teks-jawaban {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: bold;
            border: 2px solid #333;
            white-space: nowrap;
            font-size: 16px;
            z-index: 2;
        }
        @keyframes terbang {
            0% { transform: translate(0, 0) rotate(-5deg); }
            25% { transform: translate(40px, -25px) rotate(6deg); }
            50% { transform: translate(-25px, 15px) rotate(-4deg); }
            75% { transform: translate(25px, 30px) rotate(5deg); }
            100% { transform: translate(-15px, -20px) rotate(-6deg); }
        }
        .benar { 
            background: #90EE90; 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 30px 50px; border-radius: 15px; font-size: 30px; font-weight: bold;
            z-index: 100; box-shadow: 0 0 20px green; display: none;
        }
        .salah { 
            background: #FFB6C1; 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 30px 50px; border-radius: 15px; font-size: 30px; font-weight: bold;
            z-index: 100; box-shadow: 0 0 20px red; display: none;
        }
        .skor {
            text-align: center;
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
<body>

<div class="soal-container" id="soal">
    1 × 10 = ...
</div>

<div class="area-terbang" id="areaTerbang">
    <!-- Nyamuk dibuat otomatis -->
</div>

<div class="skor">Skor: <span id="nilai">0</span></div>

<div class="benar" id="pesanBenar">✅ BENAR! 🎉</div>
<div class="salah" id="pesanSalah">❌ Coba Lagi ya 😊</div>

<script>
const daftarSoal = [
    { teks: "1 × 10 = ...", jawabanBenar: "10", pilihan: ["10", "1", "11", "20"] },
    { teks: "5 + 7 = ...", jawabanBenar: "12", pilihan: ["10", "12", "13", "9"] },
    { teks: "8 × 2 = ...", jawabanBenar: "16", pilihan: ["10", "14", "16", "18"] }
];

let nomorSoal = 0;
let skor = 0;

function tampilkanSoal() {
    const soalSekarang = daftarSoal[nomorSoal];
    document.getElementById("soal").textContent = `${nomorSoal+1}. ${soalSekarang.teks}`;
    
    const area = document.getElementById("areaTerbang");
    area.innerHTML = "";

    const pilihanAcak = [...soalSekarang.pilihan].sort(() => Math.random() - 0.5);

    pilihanAcak.forEach((jawab) => {
        const nyamuk = document.createElement("div");
        nyamuk.className = "nyamuk";
        nyamuk.style.left = `${Math.random() * 70 + 10}%`;
        nyamuk.style.top = `${Math.random() * 70 + 10}%`;
        nyamuk.style.animationDuration = `${3 + Math.random() * 2}s`;

        // Ganti dengan gambar nyamuk yang kamu upload
        const urlNyamuk = "https://raw.githubusercontent.com/hidayatrasyidsyafira/fotosiswaSMAN9/main/nyamuk.png"; // Ganti dengan link gambar kamu

        nyamuk.innerHTML = `
            <div class="badan-nyamuk">
                <div class="teks-jawaban">${jawab}</div>
                <div class="gambar-nyamuk" style="background-image: url('${urlNyamuk}')"></div>
            </div>
        `;

        nyamuk.onclick = () => {
            if (jawab === soalSekarang.jawabanBenar) {
                skor++;
                document.getElementById("nilai").textContent = skor;
                document.getElementById("pesanBenar").style.display = "block";
                setTimeout(() => {
                    document.getElementById("pesanBenar").style.display = "none";
                    nomorSoal++;
                    if (nomorSoal < daftarSoal.length) tampilkanSoal();
                    else alert(`Selesai! Skor akhir: ${skor}/${daftarSoal.length}`);
                }, 1200);
            } else {
                document.getElementById("pesanSalah").style.display = "block";
                setTimeout(() => document.getElementById("pesanSalah").style.display = "none", 1200);
            }
        };

        area.appendChild(nyamuk);
    });
}

tampilkanSoal();
</script>

</body>
</html>
